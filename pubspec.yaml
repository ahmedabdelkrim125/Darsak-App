name: darsak_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: IBMPlexArabic
      fonts:
        - asset: assets/fonts/alfont_com_IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexArabic-Text.ttf
          weight: 500