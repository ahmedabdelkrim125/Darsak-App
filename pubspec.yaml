name: darsak_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  liquid_glass_widgets: ^1.16.0
  solar_icons: ^0.2.0
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  dio: ^5.11.1
  retrofit: ^4.10.0
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.3.2
  get_it: ^9.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  retrofit_generator: ^10.3.2
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env

  fonts:
    - family: IBMPlexArabic
      fonts:
        - asset: assets/fonts/alfont_com_IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexArabic-Text.ttf
          weight: 500